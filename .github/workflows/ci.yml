name: 🚀 Incident Command CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-lint:
    name: 🧹 Backend ESLint
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🟢 Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: 📦 Install dependencies
        working-directory: backend
        run: npm ci

      - name: 🔍 Run ESLint
        working-directory: backend
        run: npm run lint

  semgrep-sast:
    name: 🛡️ Semgrep SAST
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 📦 Install Semgrep
        run: python -m pip install semgrep

      - name: 🔍 Scan Node.js backend
        run: semgrep scan --config auto backend/src/ --error
        continue-on-error: true

  bandit-sast:
    name: 🐍 Bandit Python SAST
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 📦 Install Bandit
        run: python -m pip install bandit

      - name: 🔍 Scan Python runbook service
        run: bandit -r services/runbook/app -ll
        continue-on-error: true

  checkov-iac:
    name: ☸️ Checkov Infrastructure Security
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 📦 Install Checkov
        run: python -m pip install checkov

      - name: 🔍 Scan Kubernetes infrastructure
        run: checkov -d infra/ --framework kubernetes --soft-fail

  opa-policy:
    name: 🔐 OPA Kubernetes Policy Validation
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 📦 Install PyYAML
        run: python -m pip install PyYAML

      - name: 🔐 Install Open Policy Agent
        run: |
          curl --fail --location --show-error \
            --output /tmp/opa \
            https://openpolicyagent.org/downloads/v1.21.1/opa_linux_amd64_static

          chmod +x /tmp/opa
          sudo mv /tmp/opa /usr/local/bin/opa

          opa version

      - name: 🛡️ Validate Rego policy syntax
        run: opa check policy/rego/container_security.rego

      - name: 📄 Convert Kubernetes YAML to JSON
        run: |
          python - <<'PY'
          import json
          import yaml

          with open("infra/pod.yaml") as file:
              pod = yaml.safe_load(file)

          with open("/tmp/incidentcommand-pod.json", "w") as file:
              json.dump(pod, file, indent=2)
          PY

      - name: 🚨 Enforce Kubernetes security policies
        run: |
          opa eval \
            --data policy/rego/container_security.rego \
            --input /tmp/incidentcommand-pod.json \
            --fail \
            'data.incidentcommand.security.deny == set()'

  trivy-scan:
    name: 🐳 Trivy Container Security
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🐳 Build Incident Command image
        run: |
          docker build \
            -t incidentcmd-api:latest \
            -f backend/Containerfile \
            backend/

      - name: 🛡️ Scan container with Trivy
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: incidentcmd-api:latest
          format: table
          severity: HIGH,CRITICAL
          exit-code: "0"
          ignore-unfixed: false
