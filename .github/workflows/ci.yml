name: 🚀 Incident Command CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-lint:
    name: 🧹 Backend ESLint
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🟢 Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: 📦 Install dependencies
        working-directory: backend
        run: npm ci

      - name: 🔍 Run ESLint
        working-directory: backend
        run: npm run lint

  semgrep-sast:
    name: 🛡️ Semgrep SAST
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 📦 Install Semgrep
        run: python -m pip install semgrep

      - name: 🔍 Scan Node.js backend
        run: semgrep scan --config auto backend/src/ --error
        continue-on-error: true

  bandit-sast:
    name: 🐍 Bandit Python SAST
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 📦 Install Bandit
        run: python -m pip install bandit

      - name: 🔍 Scan Python runbook service
        run: bandit -r services/runbook/app -ll
        continue-on-error: true

  checkov-iac:
    name: ☸️ Checkov Infrastructure Security
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 📦 Install Checkov
        run: python -m pip install checkov

      - name: 🔍 Scan Kubernetes infrastructure
        run: checkov -d infra/ --framework kubernetes --soft-fail
