apiVersion: v1
kind: Pod

metadata:
  name: incidentcmd-pod
  labels:
    app: incidentcommand
    environment: development

spec:
  containers:
    - name: api
      image: localhost/incidentcmd-api:latest

      ports:
        - containerPort: 3000
          hostPort: 3000
          hostIP: 127.0.0.1
          protocol: TCP

      securityContext:
        runAsNonRoot: true
        allowPrivilegeEscalation: false

      resources:
        limits:
          memory: "256Mi"
          cpu: "500m"
